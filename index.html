<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>WebGL Sierpinski Carpet</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1e1e24;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 10px; }
        #controls {
            display: flex;
            gap: 20px;
            background: #2b2b36;
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            align-items: center;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        canvas {
            border: 2px solid #444;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            background-color: #000;
        }
        label { font-size: 0.9rem; }
    </style>
</head>
<body>

    <h1>Sierpinski Carpet (WebGL)</h1>

    <div id="controls">
        <div class="control-group">
            <label for="depth">Subdivision Level:</label>
            <input type="range" id="depth" min="0" max="6" value="3">
            <span id="depthVal">3</span>
        </div>
        <div class="control-group">
            <label for="fgColor">Carpet Color:</label>
            <input type="color" id="fgColor" value="#00ffcc">
        </div>
        <div class="control-group">
            <label for="bgColor">Background Color:</label>
            <input type="color" id="bgColor" value="#111116">
        </div>
    </div>

    <canvas id="glCanvas" width="600" height="600"></canvas>

    <!-- Vertex Shader -->
    <script id="vs" type="x-shader/x-vertex">
        attribute vec2 a_position;
        void main() {
            gl_Position = vec4(a_position, 0.0, 1.0);
        }
    </script>

    <!-- Fragment Shader -->
    <script id="fs" type="x-shader/x-fragment">
        precision mediump float;
        uniform vec4 u_color;
        void main() {
            gl_FragColor = u_color;
        }
    </script>

    <script>
        let gl;
        let program;
        let positionBuffer;
        let positionLoc;
        let colorLoc;

        let points = [];
        let numSubdivisions = 3;
        let carpetColor = [0.0, 1.0, 0.8, 1.0]; // RGBA
        let clearColor = [0.06, 0.06, 0.08, 1.0];

        window.onload = function init() {
            const canvas = document.getElementById("glCanvas");
            gl = canvas.getContext("webgl");
            if (!gl) {
                alert("WebGL을 지원하지 않는 브라우저입니다.");
                return;
            }

            const vsSource = document.getElementById("vs").text;
            const fsSource = document.getElementById("fs").text;
            const vertexShader = createShader(gl, gl.VERTEX_SHADER, vsSource);
            const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
            program = createProgram(gl, vertexShader, fragmentShader);
            gl.useProgram(program);

            positionLoc = gl.getAttribLocation(program, "a_position");
            colorLoc = gl.getUniformLocation(program, "u_color");

            positionBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.enableVertexAttribArray(positionLoc);
            gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

            setupUI();

            render();
        };

        function generateCarpet() {
            points = [];
            divideSquare([-0.8, -0.8], [0.8, 0.8], numSubdivisions);

            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(points), gl.STATIC_DRAW);
        }

        function divideSquare(pMin, pMax, count) {
            if (count === 0) {
                const x1 = pMin[0], y1 = pMin[1];
                const x2 = pMax[0], y2 = pMax[1];
                points.push(x1, y1,  x2, y1,  x1, y2);
                points.push(x2, y1,  x2, y2,  x1, y2);
                return;
            }

            const dx = (pMax[0] - pMin[0]) / 3.0;
            const dy = (pMax[1] - pMin[1]) / 3.0;

            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 3; col++) {
                    if (row === 1 && col === 1) continue;

                    const subMin = [pMin[0] + col * dx, pMin[1] + row * dy];
                    const subMax = [subMin[0] + dx, subMin[1] + dy];

                    divideSquare(subMin, subMax, count - 1);
                }
            }
        }

        function render() {
            generateCarpet();

            gl.clearColor(...clearColor);
            gl.clear(gl.COLOR_BUFFER_BIT);

            gl.uniform4fv(colorLoc, carpetColor);
            gl.drawArrays(gl.TRIANGLES, 0, points.length / 2);
        }

        function setupUI() {
            document.getElementById("depth").addEventListener("input", (e) => {
                numSubdivisions = parseInt(e.target.value);
                document.getElementById("depthVal").innerText = numSubdivisions;
                render();
            });

            document.getElementById("fgColor").addEventListener("input", (e) => {
                carpetColor = hexToRgba(e.target.value);
                render();
            });

            document.getElementById("bgColor").addEventListener("input", (e) => {
                clearColor = hexToRgba(e.target.value);
                render();
            });
        }

        function hexToRgba(hex) {
            const r = parseInt(hex.slice(1, 3), 16) / 255;
            const g = parseInt(hex.slice(3, 5), 16) / 255;
            const b = parseInt(hex.slice(5, 7), 16) / 255;
            return [r, g, b, 1.0];
        }

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error("Shader compile failed:", gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        function createProgram(gl, vs, fs) {
            const prog = gl.createProgram();
            gl.attachShader(prog, vs);
            gl.attachShader(prog, fs);
            gl.linkProgram(prog);
            if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
                console.error("Program link failed:", gl.getProgramInfoLog(prog));
                return null;
            }
            return prog;
        }
    </script>
</body>
</html>
